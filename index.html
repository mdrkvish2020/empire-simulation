<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ages of Conflict - Realistic Terrain Expansion & Diplomatic Treaties</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
    <!-- Sidebar -->
    <div id="sidebar">
        <h1>Ages of Conflict</h1>

        <div>
            <div class="section-title">Simulation Speed</div>
            <div class="btn-group">
                <button class="btn" onclick="setSpeed(0)">Pause</button>
                <button class="btn active" id="btn-1x" onclick="setSpeed(1)">1x</button>
                <button class="btn" id="btn-2x" onclick="setSpeed(2)">2x</button>
                <button class="btn" id="btn-5x" onclick="setSpeed(5)">5x</button>
            </div>
        </div>

        <div>
            <div class="section-title">Leaderboard Window</div>
            <button class="btn btn-success" style="width:100%" onclick="toggleLeaderboard()">🏆 Toggle Leaderboard</button>
        </div>

        <div>
            <div class="section-title">Preloaded Map Presets</div>
            <select class="map-select" id="mapPresetSelect" onchange="loadSelectedPreset()">
                <option value="earth">🌍 World Map (Earth)</option>
                <option value="two_continents">🏰 Two Continents (East vs West)</option>
                <option value="mediterranean">🌊 Mediterranean & Europe</option>
                <option value="ring">⭕ Ring World (Inner Sea)</option>
                <option value="archipelago">🏝️ Archipelago / Islands</option>
                <option value="random">🎲 Random Noise World</option>
            </select>
        </div>

        <div>
            <div class="section-title">Map View Mode</div>
            <div class="btn-group">
                <button class="btn active" id="btn-view-nations" onclick="setMapMode('nations')">🏳️ Normal</button>
                <button class="btn" id="btn-view-alliances" onclick="setMapMode('alliances')">🛡️ Alliance</button>
                <button class="btn" id="btn-view-income" onclick="setMapMode('income')">💰 Income</button>
            </div>
        </div>

        <div>
            <div class="section-title">Camera & Map Tools</div>
            <div class="btn-group" style="margin-bottom: 6px;">
                <button class="btn" onclick="adjustZoom(1.25)">Zoom +</button>
                <button class="btn" onclick="adjustZoom(0.8)">Zoom -</button>
                <button class="btn" onclick="resetCamera()">Reset</button>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="loadSelectedPreset()">Reset Map</button>
                <button class="btn btn-danger" onclick="clearNations()">Clear Nations</button>
            </div>
        </div>
    </div>

    <!-- Leaderboard Window -->
    <div id="leaderboard-modal">
        <div class="modal-header" id="modal-drag-handle">
            <h2>🏆 Leaderboard (<span id="lb-nation-count">0</span>)</h2>
            <button class="close-btn" onclick="toggleLeaderboard()">✖</button>
        </div>
        <div class="leaderboard-filters">
            <button class="btn active" id="lb-sort-tiles" onclick="setLeaderboardSort('tiles')">🗺️ Tile</button>
            <button class="btn" id="lb-sort-gold" onclick="setLeaderboardSort('gold')">💰 Gold</button>
            <button class="btn" id="lb-sort-military" onclick="setLeaderboardSort('military')">⚔️ Army</button>
            <button class="btn" id="lb-sort-income" onclick="setLeaderboardSort('income')">📈 Inc</button>
            <button class="btn" id="lb-sort-cities" onclick="setLeaderboardSort('cities')">🏛️ City</button>
        </div>
        <div id="modal-leaderboard-list"></div>
    </div>

    <!-- Main Canvas View -->
    <div id="main-view">
        <canvas id="mapCanvas"></canvas>
        <div id="news-ticker"></div>
    </div>
</div>

<!-- Scripts loaded in dependency order -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/map.js"></script>
<script src="js/diplomacy.js"></script>
<script src="js/render.js"></script>
<script src="js/simulation.js"></script>
<script src="js/ui.js"></script>

</body>
</html>
